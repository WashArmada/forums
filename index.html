<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Society</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#c9c9cf;font:13px "Segoe UI",Inter,Verdana,Arial,sans-serif}
a{color:#ff4d4d;text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
#wrap{max-width:1040px;margin:0 auto;padding:0 10px 30px}
#top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:8px 0;font-size:12px;color:#7d7d86}
#banner{background:radial-gradient(ellipse at 12% 0%,#3d0909 0%,#140404 55%,#0b0b0d 100%);border:1px solid #3a0f0f;border-bottom:0;padding:30px 24px}
.logo{font:800 44px/1 "Segoe UI",Inter,Arial,sans-serif;letter-spacing:-1.5px;color:#fff}
.logo b{background:linear-gradient(90deg,#ff5a5a,#c21d1d);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{font-style:normal;font-weight:400;color:#8a8a8a;margin:0 6px}
.logo em{font-style:normal;font-weight:600;color:#e6e6e6;letter-spacing:-1px}
.logo small{display:block;margin-top:12px;color:#a05555;font:700 11px "Segoe UI",Inter,Arial,sans-serif;letter-spacing:4px;text-transform:uppercase}
#nav{background:linear-gradient(#8b1111,#5a0a0a);border:1px solid #3a0f0f;display:flex;flex-wrap:wrap}
#nav a{color:#f3d6d6;padding:11px 18px;font:700 13px "Segoe UI",Inter,Arial,sans-serif;letter-spacing:.3px;border-right:1px solid #450808}
#nav a:hover,#nav a.on{background:#b01818;color:#fff;text-decoration:none}
#nav .sp{flex:1}
#ann{background:#1d0b0b;border:1px solid #4a1515;border-top:0;padding:8px 14px;color:#e8a8a8;font-size:12px}
.panel{background:#141417;border:1px solid #26262b;margin-top:12px}
.ph{background:linear-gradient(#7d1010,#560909);color:#fff;font:700 13px "Segoe UI",Inter,Arial,sans-serif;letter-spacing:.3px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pb{padding:14px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{background:#1b1b1f;color:#8b8b94;font-weight:700;font-size:11px;text-align:left;padding:7px 10px;border-bottom:1px solid #26262b;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px;border-bottom:1px solid #1f1f23;vertical-align:middle}
tr:nth-child(even) td{background:#111114}
td.ic{width:34px;text-align:center}
td.st{width:100px;text-align:center;color:#8b8b94}
.dot{display:inline-block;width:10px;height:10px;background:#b01818;border-radius:2px;box-shadow:0 0 6px #7d1010}
.tt{font-weight:700;font-size:14px}
.sub{color:#80808a;font-size:11px;margin-top:2px}
.badge{display:inline-block;background:#b01818;color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:2px;margin-right:4px;letter-spacing:.3px}
.badge.g{background:#2d6a2d}.badge.b{background:#2a4d8a}.badge.d{background:#33333a;color:#bbb}
input,textarea,select{background:#09090b;color:#e0e0e6;border:1px solid #33333a;padding:8px 10px;font:inherit;width:100%;margin:3px 0 10px;border-radius:2px}
textarea{min-height:150px;font-family:Consolas,Menlo,monospace;font-size:12px}
input:focus,textarea:focus,select:focus{outline:0;border-color:#b01818}
label{font-weight:700;font-size:12px;color:#aaa}
.btn{background:linear-gradient(#b01818,#7d1010);color:#fff;border:1px solid #440000;padding:7px 15px;font:700 12px "Segoe UI",Inter,Arial,sans-serif;cursor:pointer;border-radius:2px;display:inline-block}
.btn:hover{background:#c91f1f;text-decoration:none}
.btn.alt{background:linear-gradient(#34343a,#25252a);border-color:#44444a;color:#ccc}
.btn.sm{padding:3px 10px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
pre{background:#060607;border:1px solid #26262b;color:#9fe3c8;padding:10px;overflow:auto;max-height:320px;margin:8px 0 0;font:12px Consolas,Menlo,monospace}
.auth{max-width:400px;margin:0 auto}
.err{color:#ff6b6b;min-height:18px;font-weight:700;margin-bottom:6px}
.pw{position:relative}
.pw a{position:absolute;right:10px;top:11px;font-size:11px;color:#999}
.meter{height:5px;background:#222;margin:-4px 0 4px;border-radius:3px;overflow:hidden}
.meter div{height:100%;width:0;background:#c21d1d;transition:width .2s,background .2s}
.hint{font-size:11px;color:#80808a;margin-bottom:10px;min-height:14px}
.post{border-bottom:1px solid #222226;padding:14px 0}
.post:last-child{border:0}
.post h3{margin:0;font:800 16px "Segoe UI",Inter,Arial,sans-serif;color:#fff}
.meta{color:#80808a;font-size:11px;margin:4px 0}
.post p{margin:6px 0 0;white-space:pre-wrap;line-height:1.5}
.empty{text-align:center;color:#6a6a72;padding:26px}
.tag{display:inline-block;background:#1f1f24;border:1px solid #33333a;color:#aaa;padding:1px 8px;font-size:11px;border-radius:10px;margin:2px 3px 0 0;cursor:pointer}
.tag:hover,.tag.on{border-color:#b01818;color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:2;margin:0}.tools select{flex:1;margin:0}
.av{width:72px;height:72px;background:linear-gradient(135deg,#c21d1d,#4a0808);display:flex;align-items:center;justify-content:center;font:800 32px "Segoe UI",Inter,Arial,sans-serif;color:#fff;border-radius:4px}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.stat div{background:#0f0f12;border:1px solid #26262b;padding:8px 14px;min-width:90px}
.stat b{display:block;font:800 20px "Segoe UI",Inter,Arial,sans-serif;color:#fff}
.shout{max-height:260px;overflow:auto;margin-bottom:10px}
.shout div{padding:5px 0;border-bottom:1px solid #1d1d21;word-break:break-word}
.shout span{color:#666;font-size:10px;margin-left:6px}
.hidden{display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#b01818;color:#fff;padding:9px 18px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;border-radius:2px;z-index:9}
#toast.show{opacity:1}
#foot{margin-top:18px;color:#55555c;font-size:11px;text-align:center}
@media(max-width:640px){td.st,th.st{display:none}.logo{font-size:28px}#nav a{padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<div id="wrap">
<div id="top"><div id="welcome"></div><div id="clock"></div></div>
<div id="banner"><div class="logo"><b>The</b><i>-</i><em>Secret Society</em><small>The Washiez Chaos Forum</small></div></div>
<div id="nav"></div>
<div id="ann"></div>
<div id="view"></div>
<div id="foot"> The WashArmada &copy; <span id="yr"></span>. Not affiliated with Roblox Corporation.</div>
</div>
<div id="toast"></div>
<script>
const CONFIG={
adminUser:"admin",
adminHash:"61657175616c6973",
membersOnly:true,
announcement:"Welcome to WashArmada! Register an account Today!",
links:[
{type:"Discord",cls:"",name:"Unavaible",desc:"Support, announcements and chat.",url:"https://discord.gg/yourinvite"},
{type:"Roblox",cls:"g",name:"Roblox Group",desc:"Join the official group.",url:"https://www.roblox.com/groups/0000000"},
{type:"Roblox",cls:"g",name:"Our Game",desc:"Play on Roblox.",url:"https://www.roblox.com/games/0000000"},
{type:"Social",cls:"b",name:"YouTube",desc:"Showcases and tutorials.",url:"https://youtube.com/@yourchannel"}
]
};

const K=[],H0=[];
(function(){let p=0;for(let c=2;p<64;c++){let ok=true;for(let i=2;i*i<=c;i++)if(c%i===0){ok=false;break}if(ok){if(p<8)H0[p]=(Math.pow(c,.5)%1)*4294967296|0;K[p++]=(Math.pow(c,1/3)%1)*4294967296|0}}})();
function sha256(str){
const d=new TextEncoder().encode(str),by=Array.from(d),bits=d.length*8;
by.push(128);while(by.length%64!==56)by.push(0);
for(let i=7;i>=0;i--)by.push(i>3?0:(bits>>>(i*8))&255);
let h=H0.slice();
for(let o=0;o<by.length;o+=64){
const w=new Array(64);
for(let i=0;i<16;i++)w[i]=(by[o+i*4]<<24)|(by[o+i*4+1]<<16)|(by[o+i*4+2]<<8)|by[o+i*4+3];
for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10)))|0}
let [a,b,c,dd,e,f,g,hh]=h;
for(let i=0;i<64;i++){
const t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+w[i])|0;
const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;
hh=g;g=f;f=e;e=(dd+t1)|0;dd=c;c=b;b=a;a=(t1+t2)|0}
h=[h[0]+a|0,h[1]+b|0,h[2]+c|0,h[3]+dd|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
}
return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function hashPw(u,p){let x=u+":"+p;for(let i=0;i<500;i++)x=sha256(x+":"+p);return x}

const $=s=>document.querySelector(s);
const store={
get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
const mem={};
function ls(k,d){return k in mem?mem[k]:store.get(k,d)}
function ss(k,v){mem[k]=v;store.set(k,v)}

let page="home",filterTag="",query="",sortBy="new",openCode={};
let me=null;
try{me=sessionStorage.getItem("waMe")}catch(e){}
let remote={scripts:[],updates:[]};

function esc(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function fmt(ts){return new Date(ts).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}
function isAdmin(){return !!me&&me.toLowerCase()===CONFIG.adminUser.toLowerCase()}
function users(){return ls("waUsers",{})}
function scripts(){return ls("waScripts",[]).map(s=>({...s,local:true})).concat(remote.scripts).sort((a,b)=>b.time-a.time)}
function updates(){return ls("waUpdates",[]).map(s=>({...s,local:true})).concat(remote.updates).sort((a,b)=>b.time-a.time)}
function views(){return ls("waViews",{})}

function strength(p){
let s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
return s;
}

function nav(){
const items=[["home","Home"],["scripts","Scripts"],["updates","Updates"],["members","Members"]];
let h=items.map(i=>`<a data-go="${i[0]}" class="${page===i[0]?"on":""}">${i[1]}</a>`).join("")+'<span class="sp"></span>';
h+=me?`<a data-go="profile" class="${page==="profile"?"on":""}">My Profile</a><a data-act="logout">Logout</a>`:`<a data-go="login" class="${page==="login"?"on":""}">Login</a><a data-go="register" class="${page==="register"?"on":""}">Register</a>`;
$("#nav").innerHTML=h;
$("#welcome").innerHTML=me?`Logged in as <b style="color:#ff4d4d">${esc(me)}</b>${isAdmin()?' <span class="badge">Admin</span>':""}`:"Welcome, Guest. Please login or register.";
$("#ann").textContent=CONFIG.announcement;
$("#ann").classList.toggle("hidden",!CONFIG.announcement);
}

function linksPanel(){
return `<div class="panel"><div class="ph">Community</div><table><tr><th></th><th>Link</th><th class="st">Type</th></tr>${CONFIG.links.map(l=>`<tr><td class="ic"><span class="dot"></span></td><td><a class="tt" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a><div class="sub">${esc(l.desc)}</div></td><td class="st"><span class="badge ${l.cls}">${esc(l.type)}</span></td></tr>`).join("")}</table></div>`;
}

function shoutPanel(){
const list=ls("waShouts",[]).slice(-40);
return `<div class="panel"><div class="ph">Shoutbox${isAdmin()?'<a class="btn sm alt" data-act="clearshouts">Clear</a>':""}</div><div class="pb"><div class="shout" id="shoutList">${list.length?list.map(s=>`<div><a data-user="${esc(s.u)}"><b>${esc(s.u)}</b></a>: ${esc(s.t)}<span>${ago(s.time)}</span></div>`).join(""):'<div class="sub">No messages yet.</div>'}</div>${me?'<div class="row"><input id="shoutIn" maxlength="160" placeholder="Say something..." style="flex:1;margin:0"><a class="btn" data-act="shout">Send</a></div>':'<div class="sub">Login to chat.</div>'}</div></div>`;
}

function homePage(){
const s=scripts(),u=updates(),n=Object.keys(users()).length+1;
const latest=s.slice(0,4).map(x=>`<tr><td class="ic"><span class="dot"></span></td><td><a class="tt" data-go="scripts">${esc(x.title)}</a><div class="sub">${esc(x.game||"Universal")} - ${ago(x.time)}</div></td></tr>`).join("")||'<tr><td class="empty">Nothing yet.</td></tr>';
const lu=u.slice(0,3).map(x=>`<tr><td class="ic"><span class="dot"></span></td><td><a class="tt" data-go="updates">${esc(x.title)}</a><div class="sub">${ago(x.time)}</div></td></tr>`).join("")||'<tr><td class="empty">Nothing yet.</td></tr>';
return `<div class="grid"><div>${linksPanel()}<div class="panel"><div class="ph">Latest Scripts<a class="btn sm alt" data-go="scripts">View all</a></div><table>${latest}</table></div><div class="panel"><div class="ph">Latest Updates<a class="btn sm alt" data-go="updates">View all</a></div><table>${lu}</table></div></div><div>${shoutPanel()}<div class="panel"><div class="ph">Statistics</div><div class="pb"><div class="stat"><div><b>${n}</b>Members</div><div><b>${s.length}</b>Scripts</div><div><b>${u.length}</b>Updates</div></div></div></div></div></div>`;
}

function scriptsPage(){
let list=scripts();
const tags=[...new Set(list.flatMap(s=>s.tags||[]))];
const v=views();
if(query){const q=query.toLowerCase();list=list.filter(s=>(s.title+" "+(s.desc||"")+" "+(s.game||"")+" "+(s.tags||[]).join(" ")).toLowerCase().includes(q))}
if(filterTag)list=list.filter(s=>(s.tags||[]).includes(filterTag));
if(sortBy==="old")list.sort((a,b)=>a.time-b.time);
if(sortBy==="views")list.sort((a,b)=>(v[b.id]||0)-(v[a.id]||0));
if(sortBy==="az")list.sort((a,b)=>a.title.localeCompare(b.title));
const canView=!CONFIG.membersOnly||!!me;
const admin=isAdmin()?`<div class="panel"><div class="ph">Upload Script</div><div class="pb"><div class="grid" style="gap:10px"><div><label>Title</label><input id="sTitle"></div><div><label>Game</label><input id="sGame" placeholder="Universal"></div></div><label>Description</label><input id="sDesc"><label>Tags (comma separated)</label><input id="sTags" placeholder="autofarm, gui, keyless"><label>Lua Code</label><textarea id="sCode" spellcheck="false"></textarea><div class="row"><a class="btn" data-act="addscript">Publish</a><label class="btn alt" style="margin:0">Load .lua file<input type="file" id="sFile" accept=".lua,.txt" hidden></label><a class="btn alt" data-act="export">Export data.json</a></div><div class="sub" style="margin-top:8px">Posts save in this browser. Export data.json and commit it next to index.html to publish for everyone.</div></div></div>`:"";
const rows=list.map(s=>{
const code=openCode[s.id];
return `<div class="post"><div class="row between"><h3>${esc(s.title)}</h3><div class="row">${canView?`<a class="btn sm" data-copy="${s.id}">Copy</a><a class="btn sm alt" data-dl="${s.id}">Download</a><a class="btn sm alt" data-toggle="${s.id}">${code?"Hide":"View"}</a>`:'<a class="btn sm" data-go="login">Login to access</a>'}${isAdmin()&&s.local?`<a class="btn sm alt" data-del="s:${s.id}">Delete</a>`:""}</div></div><div class="meta"><span class="badge d">${esc(s.game||"Universal")}</span>${esc(s.desc||"")} - ${fmt(s.time)} - ${v[s.id]||0} views</div><div>${(s.tags||[]).map(t=>`<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}</div>${canView&&code?`<pre>${esc(s.code)}</pre>`:""}</div>`}).join("");
return `${admin}<div class="panel"><div class="ph">Lua Scripts (${list.length})</div><div class="pb"><div class="tools"><input id="q" placeholder="Search scripts..." value="${esc(query)}"><select id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="views">Most viewed</option><option value="az">A to Z</option></select></div><div style="margin-top:8px">${tags.map(t=>`<span class="tag ${filterTag===t?"on":""}" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}${filterTag?'<a class="tag" data-tag="">clear</a>':""}</div>${rows||'<div class="empty">No scripts found.</div>'}</div></div>`;
}

function updatesPage(){
const admin=isAdmin()?`<div class="panel"><div class="ph">Post Update</div><div class="pb"><label>Version / Title</label><input id="uTitle"><label>Notes</label><textarea id="uBody" style="min-height:90px;font-family:inherit"></textarea><a class="btn" data-act="addupdate">Post</a></div></div>`:"";
const list=updates();
return `${admin}<div class="panel"><div class="ph">Updates &amp; Changelog</div><div class="pb">${list.map(u=>`<div class="post"><div class="row between"><h3>${esc(u.title)}</h3>${isAdmin()&&u.local?`<a class="btn sm alt" data-del="u:${u.id}">Delete</a>`:""}</div><div class="meta"><span class="badge b">Update</span>${fmt(u.time)}</div><p>${esc(u.body)}</p></div>`).join("")||'<div class="empty">No updates yet.</div>'}</div></div>`;
}

function membersPage(){
const us=Object.values(users()).sort((a,b)=>a.joined-b.joined);
const rows=[`<tr><td class="ic"><span class="dot"></span></td><td><b class="tt">${esc(CONFIG.adminUser)}</b></td><td class="st"><span class="badge">Admin</span></td><td class="st">Founder</td></tr>`].concat(us.map(x=>`<tr><td class="ic"><span class="dot"></span></td><td><a class="tt" data-user="${esc(x.name)}">${esc(x.name)}</a></td><td class="st"><span class="badge d">Member</span></td><td class="st">${fmt(x.joined)}</td></tr>`));
return `<div class="panel"><div class="ph">Members (${rows.length})</div><table><tr><th></th><th>Username</th><th class="st">Rank</th><th class="st">Joined</th></tr>${rows.join("")}</table></div>`;
}

function profilePage(name){
const target=name||me;
if(!target)return loginPage();
const adminT=target.toLowerCase()===CONFIG.adminUser.toLowerCase();
const acc=users()[target.toLowerCase()];
if(!adminT&&!acc)return '<div class="panel"><div class="pb empty">User not found.</div></div>';
const posts=ls("waShouts",[]).filter(s=>s.u.toLowerCase()===target.toLowerCase()).length;
const own=!!me&&me.toLowerCase()===target.toLowerCase();
const pw=own?`<div class="panel"><div class="ph">Change Password</div><div class="pb" style="max-width:400px"><label>Current password</label><input id="cp" type="password"><label>New password</label><input id="np" type="password"><div class="err" id="pErr"></div><a class="btn" data-act="chpw">Update</a>${adminT?"":' <a class="btn alt" data-act="delacc">Delete account</a>'}</div></div>`:"";
return `<div class="panel"><div class="ph">Profile</div><div class="pb"><div class="prof"><div class="av">${esc(target[0].toUpperCase())}</div><div><div class="tt" style="font-size:20px">${esc(adminT?CONFIG.adminUser:acc.name)}</div><div class="sub">${adminT?'<span class="badge">Admin</span>Founder':'<span class="badge d">Member</span>Joined '+fmt(acc.joined)}</div></div></div><div class="stat"><div><b>${posts}</b>Shouts</div><div><b>${adminT?"Staff":"Member"}</b>Rank</div></div></div></div>${pw}`;
}

function loginPage(){
return `<div class="panel auth"><div class="ph">Login</div><div class="pb"><label>Username</label><input id="lUser" autocomplete="username"><label>Password</label><div class="pw"><input id="lPass" type="password" autocomplete="current-password"><a data-show="lPass">show</a></div><div class="err" id="lErr"></div><a class="btn" data-act="login">Login</a><div class="sub" style="margin-top:10px">No account? <a data-go="register">Register here</a>.</div></div></div>`;
}

function registerPage(){
return `<div class="panel auth"><div class="ph">Create Account</div><div class="pb"><label>Username</label><input id="rUser" autocomplete="username" maxlength="20"><div class="hint">3 to 20 letters, numbers or underscores.</div><label>Password</label><div class="pw"><input id="rPass" type="password" autocomplete="new-password"><a data-show="rPass">show</a></div><div class="meter"><div id="meter"></div></div><div class="hint" id="mtext">At least 6 characters.</div><label>Confirm Password</label><input id="rPass2" type="password" autocomplete="new-password"><div class="err" id="rErr"></div><a class="btn" data-act="register">Create Account</a><div class="sub" style="margin-top:10px">Already registered? <a data-go="login">Login</a>.</div></div></div>`;
}

function render(){
nav();
const p={home:homePage,scripts:scriptsPage,updates:updatesPage,members:membersPage,profile:()=>profilePage(),login:loginPage,register:registerPage};
$("#view").innerHTML=(p[page]||homePage)();
}
function go(p){page=p;render();window.scrollTo(0,0)}

function setMe(n){
me=n;
try{if(n)sessionStorage.setItem("waMe",n);else sessionStorage.removeItem("waMe")}catch(e){}
}

function doRegister(){
const err=$("#rErr"),u=$("#rUser").value.trim(),p=$("#rPass").value,p2=$("#rPass2").value;
try{
if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){err.textContent="Username must be 3 to 20 letters, numbers or underscores.";return}
const all=users();
if(u.toLowerCase()===CONFIG.adminUser.toLowerCase()||all[u.toLowerCase()]){err.textContent="That username is already taken.";return}
if(p.length<6){err.textContent="Password must be at least 6 characters.";return}
if(p!==p2){err.textContent="Passwords do not match.";return}
all[u.toLowerCase()]={name:u,hash:hashPw(u.toLowerCase(),p),joined:Date.now()};
ss("waUsers",all);
setMe(u);go("profile");toast("Account created. Welcome, "+u+"!");
}catch(e){err.textContent="Could not create account: "+e.message}
}

function doLogin(){
const err=$("#lErr"),u=$("#lUser").value.trim(),p=$("#lPass").value;
try{
if(!u||!p){err.textContent="Enter your username and password.";return}
if(u.toLowerCase()===CONFIG.adminUser.toLowerCase()){
if(sha256(p)===CONFIG.adminHash){setMe(CONFIG.adminUser);go("home");toast("Logged in as admin");return}
err.textContent="Invalid username or password.";return;
}
const acc=users()[u.toLowerCase()];
if(acc&&acc.hash===hashPw(u.toLowerCase(),p)){setMe(acc.name);go("home");toast("Welcome back, "+acc.name);return}
err.textContent="Invalid username or password.";
}catch(e){err.textContent="Login failed: "+e.message}
}

function findScript(id){return scripts().find(x=>x.id===id)}
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function bump(id){const v=views();v[id]=(v[id]||0)+1;ss("waViews",v)}

const actions={
login:doLogin,register:doRegister,
logout(){setMe(null);go("home");toast("Logged out")},
shout(){
const i=$("#shoutIn"),t=i.value.trim();if(!t||!me)return;
const l=ls("waShouts",[]);l.push({u:me,t:t.slice(0,160),time:Date.now()});ss("waShouts",l.slice(-100));render();
},
clearshouts(){ss("waShouts",[]);render()},
addscript(){
if(!isAdmin())return;
const title=$("#sTitle").value.trim(),code=$("#sCode").value;
if(!title||!code.trim()){toast("Title and code are required");return}
const l=ls("waScripts",[]);
l.unshift({id:"s"+Date.now().toString(36),title,game:$("#sGame").value.trim(),desc:$("#sDesc").value.trim(),tags:$("#sTags").value.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean),code,time:Date.now()});
ss("waScripts",l);render();toast("Script published");
},
addupdate(){
if(!isAdmin())return;
const title=$("#uTitle").value.trim(),body=$("#uBody").value.trim();
if(!title||!body){toast("Title and notes are required");return}
const l=ls("waUpdates",[]);l.unshift({id:"u"+Date.now().toString(36),title,body,time:Date.now()});
ss("waUpdates",l);render();toast("Update posted");
},
export(){
const strip=a=>a.map(({local,...r})=>r);
dl("data.json",JSON.stringify({scripts:strip(scripts()),updates:strip(updates())},null,2),"application/json");
toast("Commit data.json to your repo");
},
chpw(){
const err=$("#pErr"),cp=$("#cp").value,np=$("#np").value;
if(np.length<6){err.textContent="New password must be at least 6 characters.";return}
if(isAdmin()){err.textContent="Change the admin password in CONFIG.adminHash.";return}
const all=users(),k=me.toLowerCase();
if(all[k].hash!==hashPw(k,cp)){err.textContent="Current password is wrong.";return}
all[k].hash=hashPw(k,np);ss("waUsers",all);err.textContent="";$("#cp").value="";$("#np").value="";toast("Password updated");
},
delacc(){
if(!confirm("Delete your account permanently?"))return;
const all=users();delete all[me.toLowerCase()];ss("waUsers",all);setMe(null);go("home");toast("Account deleted");
}
};

document.addEventListener("click",e=>{
const t=e.target.closest("[data-go],[data-act],[data-copy],[data-dl],[data-toggle],[data-tag],[data-del],[data-show],[data-user]");
if(!t)return;
const d=t.dataset;
if(d.go!==undefined){go(d.go);return}
if(d.act){actions[d.act]&&actions[d.act]();return}
if(d.user!==undefined){page="profile";nav();$("#view").innerHTML=profilePage(d.user);window.scrollTo(0,0);return}
if(d.show){const i=document.getElementById(d.show);i.type=i.type==="password"?"text":"password";t.textContent=i.type==="password"?"show":"hide";return}
if(d.tag!==undefined){filterTag=d.tag;render();return}
if(d.toggle){openCode[d.toggle]=!openCode[d.toggle];if(openCode[d.toggle])bump(d.toggle);render();return}
if(d.copy){const s=findScript(d.copy);if(s){bump(s.id);navigator.clipboard?navigator.clipboard.writeText(s.code).then(()=>toast("Copied to clipboard"),()=>toast("Copy failed")):toast("Copy not supported")}return}
if(d.dl){const s=findScript(d.dl);if(s){bump(s.id);dl(s.title.replace(/\W+/g,"_")+".lua",s.code,"text/plain");toast("Downloaded")}return}
if(d.del&&isAdmin()){
const[k,id]=d.del.split(":"),key=k==="s"?"waScripts":"waUpdates";
ss(key,ls(key,[]).filter(x=>x.id!==id));render();
}
});

document.addEventListener("input",e=>{
if(e.target.id==="q"){query=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
if(e.target.id==="rPass"){
const s=strength(e.target.value),c=["#c21d1d","#c21d1d","#d9822b","#c9b92b","#7bb83a","#2d9a4a"],l=["Too short","Weak","Fair","Good","Strong","Excellent"];
$("#meter").style.width=(s*20)+"%";$("#meter").style.background=c[s];$("#mtext").textContent=e.target.value?l[s]:"At least 6 characters.";
}
});
document.addEventListener("change",e=>{
if(e.target.id==="sort"){sortBy=e.target.value;render();$("#sort").value=sortBy}
if(e.target.id==="sFile"){
const f=e.target.files[0];if(!f)return;
const r=new FileReader();r.onload=()=>{$("#sCode").value=r.result;if(!$("#sTitle").value)$("#sTitle").value=f.name.replace(/\.[^.]+$/,"")};r.readAsText(f);
}
});
document.addEventListener("keydown",e=>{
if(e.key!=="Enter")return;
const id=e.target.id;
if(id==="lUser"||id==="lPass")doLogin();
if(id==="rUser"||id==="rPass"||id==="rPass2")doRegister();
if(id==="shoutIn")actions.shout();
});

function tick(){$("#clock").textContent=new Date().toLocaleString()}
tick();setInterval(tick,30000);
$("#yr").textContent=new Date().getFullYear();
render();
fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
if(d){remote={scripts:Array.isArray(d.scripts)?d.scripts:[],updates:Array.isArray(d.updates)?d.updates:[]};render()}
}).catch(()=>{});
</script>
</body>
</html>
